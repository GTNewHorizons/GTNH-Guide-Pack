name: Validate guide pack

on:
  pull_request:
    paths:
      - "assets/**"
      - "pack.mcmeta"
      - ".github/workflows/validate-guide-pack.yml"
  push:
    branches: [ master ]
    paths:
      - "assets/**"
      - "pack.mcmeta"
      - ".github/workflows/validate-guide-pack.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out GuideVSC validator
        uses: actions/checkout@v4
        with:
          repository: ABKQPO/GuideNH-VSC
          ref: master
          path: .ci/guide-vsc

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: .ci/guide-vsc/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install YAML parser
        run: python -m pip install PyYAML==6.0.2

      - name: Validate metadata and guide frontmatter
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          import yaml

          json.loads(Path("pack.mcmeta").read_text(encoding="utf-8-sig"))

          errors = 0
          for path in sorted(Path("assets").glob("**/guidenh/**/*.md")):
              text = path.read_text(encoding="utf-8-sig")
              if not text.startswith("---\n"):
                  if text.partition("\n")[0].rstrip(" \t") == "---":
                      print(f"::error file={path},line=1::Opening YAML fence must be exactly ---")
                      errors += 1
                  continue

              end = text.find("\n---\n", 4)
              if end < 0 and text.endswith("\n---"):
                  end = len(text) - 4
              if end < 0:
                  print(f"::error file={path},line=1::Unclosed YAML frontmatter")
                  errors += 1
                  continue

              try:
                  frontmatter = yaml.safe_load(text[4:end])
                  if frontmatter is not None and not isinstance(frontmatter, dict):
                      raise TypeError("Frontmatter root must be a map")
              except yaml.YAMLError as error:
                  mark = getattr(error, "problem_mark", None)
                  line = mark.line + 2 if mark else 1
                  message = str(error).replace("\n", " ")
                  print(f"::error file={path},line={line}::{message}")
                  errors += 1
              except TypeError as error:
                  print(f"::error file={path},line=1::{error}")
                  errors += 1

          if errors:
              raise SystemExit(f"Invalid guide frontmatter in {errors} file(s)")
          PY

      - name: Build GuideVSC validator
        working-directory: .ci/guide-vsc
        run: |
          npm ci
          npm run compile

      - name: Validate GuideNH pages, resources, and tags
        env:
          GUIDE_VSC_ROOT: ${{ github.workspace }}/.ci/guide-vsc
        run: |
          node - <<'NODE'
          const fs = require('fs/promises');
          const path = require('path');
          const { pathToFileURL } = require('url');

          const validatorRoot = process.env.GUIDE_VSC_ROOT;
          const guidePackRoot = process.env.GITHUB_WORKSPACE;
          const { GuideNhWorkspaceIndex } = require(path.join(validatorRoot, 'out/server/index/workspaceIndex.js'));
          const { GuideNhResourceIndex } = require(path.join(validatorRoot, 'out/server/index/resourceIndex.js'));
          const { indexGuideNhWorkspaceFolder } = require(path.join(validatorRoot, 'out/server/index/workspaceScanner.js'));
          const { createGuideNhDiagnostics } = require(path.join(validatorRoot, 'out/server/providers/diagnostics.js'));
          const { loadGuideNhSchema } = require(path.join(validatorRoot, 'out/server/schema/schemaLoader.js'));

          function isGuideMarkdownPath(filePath) {
            return /\/assets\/[^/]+\/guidenh\/(?:guidenh\/)?_[a-z]{2}_[a-z]{2}\/.+\.md$/i.test(filePath.replace(/\\/g, '/'));
          }

          async function collectGuideMarkdownPaths(directory) {
            const paths = [];
            const entries = await fs.readdir(directory, { withFileTypes: true });
            for (const entry of entries.sort((left, right) => left.name.localeCompare(right.name))) {
              const fullPath = path.join(directory, entry.name);
              if (entry.isDirectory()) {
                if (!['.git', 'node_modules', 'out', 'dist'].includes(entry.name)) {
                  paths.push(...await collectGuideMarkdownPaths(fullPath));
                }
              } else if (entry.isFile() && isGuideMarkdownPath(fullPath)) {
                paths.push(fullPath);
              }
            }
            return paths;
          }

          function escapeAnnotation(value) {
            return String(value)
              .replace(/%/g, '%25')
              .replace(/\r/g, '%0D')
              .replace(/\n/g, '%0A')
              .replace(/:/g, '%3A')
              .replace(/,/g, '%2C');
          }

          async function main() {
            const pageIndex = new GuideNhWorkspaceIndex();
            const resourceIndex = new GuideNhResourceIndex();
            const rootUri = pathToFileURL(guidePackRoot).toString();
            await indexGuideNhWorkspaceFolder(rootUri, pageIndex, resourceIndex);
            const schema = await loadGuideNhSchema(path.join(validatorRoot, 'src/schema'));
            const pages = await collectGuideMarkdownPaths(guidePackRoot);
            let errors = 0;
            let warnings = 0;
            for (const pagePath of pages) {
              const text = await fs.readFile(pagePath, 'utf8');
              const uri = pathToFileURL(pagePath).toString();
              const diagnostics = createGuideNhDiagnostics(text, schema, pageIndex, resourceIndex, uri);
              for (const diagnostic of diagnostics) {
                const resourceWarning = diagnostic.message.startsWith('Unknown resource ');
                const level = resourceWarning ? 'warning' : 'error';
                const relativePath = path.relative(guidePackRoot, pagePath).replace(/\\/g, '/');
                const line = diagnostic.range.start.line + 1;
                const column = diagnostic.range.start.character + 1;
                console.log(`::${level} file=${escapeAnnotation(relativePath)},line=${line},col=${column}::${escapeAnnotation(diagnostic.message)}`);
                if (resourceWarning) {
                  warnings++;
                } else {
                  errors++;
                }
              }
            }
            console.log(`GuideVSC validation completed with ${errors} error(s) and ${warnings} warning(s).`);
            if (errors > 0) {
              process.exitCode = 1;
            }
          }

          main().catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE
